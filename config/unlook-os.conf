# ---------------------------------------------------------------------------
# Unlook OS -- build configuration (the ONLY place build-time knobs live).
#
# Sourced by build.sh, the pi-gen stage scripts and image/mkimage.sh. Plain
# KEY=value assignments only (no commands): every value is validated by
# scripts/lib.sh:conf_validate before it is used. CI may override any key with
# an environment variable of the same name.
# ---------------------------------------------------------------------------

# ---- identity / versioning -------------------------------------------------
IMG_NAME=unlook-os
# Release version. CI derives it from the git tag (vYYYY.MM.N); local builds
# get "<this>~dev.<git sha>" so a dev build never outranks a release.
UNLOOK_OS_VERSION=2026.10.0
# RAUC compatible string: a bundle installs only on a system with the same one.
RAUC_COMPATIBLE=supernova-unlook-cm5

# ---- base distribution -----------------------------------------------------
UNLOOK_OS_SUITE=bookworm
PIGEN_REPO=https://github.com/RPi-Distro/pi-gen.git
# Release builds MUST pin a commit SHA here (build.sh warns on a branch name).
PIGEN_REF=arm64
LOCALE_DEFAULT=en_GB.UTF-8
KEYBOARD_KEYMAP=us
KEYBOARD_LAYOUT="English (US)"
TIMEZONE_DEFAULT=Europe/Rome
# Wi-Fi regulatory domain: required for the hotspot (5 GHz channels).
WPA_COUNTRY=IT

# ---- users -----------------------------------------------------------------
# Admin login (key-only SSH, password locked). The daemon's service user.
ADMIN_USER=unlook-admin
SERVICE_USER=unlook

# ---- boot / device tree ----------------------------------------------------
# Camera overlays, space separated, in load order. Mira220 stereo with hardware
# sync (drivers/mira220-sync, built by stage 01-camera against the image kernel):
#   CAM0 = master (free-running)
#   CAM1 = slave (trigger-mode=1)
# Camera enable: overlays/unlook-cam-enable forces the CAM_GPIO regulators
# (cam0_reg/cam1_reg; RP1 GPIO 34 on CM5) always on; it is loaded before these.
# libcamera tuning: mira220-sync.json -> mira220.json, as in drivers/mira220-sync/README.md (stage 01-camera).
# The JST sync cable J6 (master) <-> J4 (slave) and the sync switches in
# position 2 are required for trigger-mode=1 to produce frames.
CAMERA_OVERLAYS="mira220-sync,cam0 mira220-sync,trigger-mode=1"
# Stream start order of the synchronised pair, forced on the daemon through
# UNLOOK_CAMERA_START_ORDER (overrides any profile). Owner requirement: MASTER
# first, then SLAVE (stop is the reverse). master_first | slave_first.
CAMERA_START_ORDER=master_first
# Out-of-tree Mira220 driver (git submodule, pinned). Empty = none (bring-up
# without cameras only).
MIRA220_DRIVER_DIR=drivers/mira220-sync
# libcamera with the Mira220 camera helper + tuning (the Raspberry Pi archive
# build has no Mira220 support). Built by libcamera/build-deb.sh from this fork
# into debs/; empty = stock Raspberry Pi libcamera (cameras enumerate in V4L2
# but libcamera will not open them). See docs/OS.md §10.
# ams-OSRAM fork, main = libcamera 0.7.1 + cam_helper_mira220 + mira220(.mono).json
# for pisp (CM5) and vc4 (CM4); pinned commit of 2026-07-09.
LIBCAMERA_REPO=https://github.com/ams-OSRAM/libcamera
LIBCAMERA_REF=d7d5e17ec961d3f1d2b217217b70ec242e6d8bd4
# AS1170 illuminator + BMI270 IMU are driven from user space over i2c-dev on
# the ARM I2C bus (profile i2c_bus / imu_i2c_bus): no kernel overlay needed.
I2C_ARM=on
# UART for the Unlook Command Protocol (profile serial_device=/dev/ttyAMA0 on
# GPIO14/15). The rescue console stays on the debug UART (serial0).
UART_UCP=on
# USB-C gadget (CDC-ACM + ECM). 1 = dtoverlay=dwc2,dr_mode=peripheral.
USB_GADGET=1
USB_GADGET_ADDRESS=10.43.0.1/24
# Extra dtoverlay= lines, space separated (e.g. a display).
EXTRA_DTOVERLAYS=

# ---- network exposure (firewall) -------------------------------------------
# Must match the profile's stream_port / command_port.
FW_TCP_PORTS="5555 5556"

# ---- partition layout (MiB) -- see image/mkimage.sh ------------------------
PART_CFG_MB=64
PART_BOOT_MB=256
PART_ROOT_MB=3584
# Initial size; grown to the end of the medium on first boot.
PART_DATA_MB=512

# ---- update channels -------------------------------------------------------
# Empty = network update channel OFF (no server yet; a self-hosted Forgejo is
# planned). OS updates from a local file (`unlook-ota apply os --bundle`) still work.
# Debian repository hosting the SDK package (fast SDK-only updates).
UNLOOK_APT_URL=
UNLOOK_APT_SUITE=bookworm
UNLOOK_APT_COMPONENT=main
# Base URL of the RAUC bundles; the unit reads <url>/<RAUC_COMPATIBLE>/latest.
UNLOOK_OTA_URL=
# How long unlook-stream has to become healthy after an update (seconds).
HEALTH_TIMEOUT_S=120
# Hard guard: a tryboot that has not been committed after this many seconds
# reboots into the previous slot even if user space is wedged.
TRYBOOT_GUARD_S=300

# SDK update source on the unit (the SDK is ALWAYS pre-integrated in the image):
#   github = latest commit of SDK_GIT_BRANCH, fetched over SSH with a per-unit
#            read-only deploy key (boot seed unlook/sdk-deploy-key), built ON the
#            unit and installed as a .deb (interim, until the apt server exists)
#   apt    = signed apt repository UNLOOK_APT_URL
#   off    = no SDK updates
SDK_OTA_SOURCE=github
SDK_GIT_URL=git@github.com:SupernovaIndustries/unlook-sdk.git
SDK_GIT_BRANCH=main
# 1 = the branch head must carry a GPG signature trusted by
# /usr/share/unlook-os/sdk-git-trust (see docs/OS.md §9). 0 = SSH transport
# authentication only (interim).
SDK_GIT_REQUIRE_SIGNED=0

# ---- SDK package -----------------------------------------------------------
# local = install the .deb(s) from ./debs (CI artifact); apt = from UNLOOK_APT_URL;
# none = hardware bring-up image without the scanner daemon (never a release:
# without unlook-stream the health check cannot commit OS updates).
SDK_DEB_SOURCE=local
# Runtime package (daemon, tools, units). libunlook-sdk-dev (headers + the -dev
# dependencies) is added only when SDK_OTA_SOURCE=github builds on the unit.
SDK_PACKAGE=libunlook-sdk
# User the daemon runs as. root (today) | unlook: the OS ships the polkit /
# D-Bus / device rules for `unlook`; switch once validated on the Pi
# (docs/OS.md §9 "Daemon user").
SDK_DAEMON_USER=root

# ---- signing material ------------------------------------------------------
# Directory holding rauc-keyring.pem and apt-archive-keyring.gpg (public
# material only). keys/dev is created by scripts/dev-keys.sh; production CI
# points this at the company keys (docs/OS.md §9). The build refuses to run
# without both files.
KEYS_DIR=keys/dev

# ---- branding --------------------------------------------------------------
# auto = install the Plymouth splash when branding/ holds the assets.
BRANDING=auto
