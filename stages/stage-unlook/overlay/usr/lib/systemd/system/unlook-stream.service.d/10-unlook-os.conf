# Unlook OS integration of the SDK's boot worker (unit shipped by the .deb).
# unlook-stream starts at EVERY boot (enabled in the image): BLE pairing,
# hotspot on demand, stream 5555, UCP 5556 -- the phone controls the scanner
# directly. First-boot provisioning runs before it but its failure must never
# keep the daemon down (Wants, not Requires).
[Unit]
Wants=unlook-firstboot.service unlook-identity.service unlook-wifi.service bluetooth.service NetworkManager.service
After=unlook-firstboot.service unlook-identity.service unlook-wifi.service nftables.service bluetooth.service NetworkManager.service
RequiresMountsFor=/etc/unlook /var/lib/unlook /var/lib/unlook-ota
# Keep retrying (the SDK unit restarts every 3 s until the cameras answer):
# never give up and leave the unit unreachable from the phone.
StartLimitIntervalSec=0

[Service]
# Calibration lives on the data partition: $HOME/unlook_calib.
Environment=HOME=/var/lib/unlook
# Tamper-evident audit trail with the per-unit key made at first boot.
Environment=UNLOOK_AUDIT_LOG=/var/lib/unlook/audit/audit.log
Environment=UNLOOK_AUDIT_KEY_FILE=/etc/unlook/audit.key
Environment=UNLOOK_REPORT_DIR=/var/lib/unlook/reports
Environment=UNLOOK_CAD_DIR=/var/lib/unlook/cad
# Stereo pair start order, owner requirement (config CAMERA_START_ORDER):
# overrides whatever the profile says.
Environment=UNLOOK_CAMERA_START_ORDER=@CAMERA_START_ORDER@
# OS update state lives in /var/lib/unlook-ota (root-owned), not in the daemon's
# state directory.
Environment=UNLOOK_OTA_LAST=/var/lib/unlook-ota/last
# Network mode from unlook-wifi (net_mode ap until a Wi-Fi is saved, then ble;
# hotspot address and interface from NET_AP_*), then the per-unit operator
# overrides (UNLOOK_* only, data partition): the later file wins.
EnvironmentFile=-/run/unlook/net.env
EnvironmentFile=-/etc/unlook/stream.env
UMask=0077
# Conservative sandboxing. The daemon still runs as root (nmcli hotspot, BlueZ
# GATT registration, /dev/i2c-*, GPIO): see docs/SDK_CHANGES.md §5.
PrivateTmp=yes
ProtectHome=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
RestrictSUIDSGID=yes
LockPersonality=yes
NoNewPrivileges=yes
