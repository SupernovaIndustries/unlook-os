# Unlook OS integration of the SDK's boot worker (unit shipped by the .deb).
[Unit]
Requires=unlook-firstboot.service
After=unlook-firstboot.service unlook-identity.service nftables.service
RequiresMountsFor=/etc/unlook /var/lib/unlook

[Service]
# Calibration lives on the data partition: $HOME/unlook_calib.
Environment=HOME=/var/lib/unlook
# Tamper-evident audit trail with the per-unit key made at first boot.
Environment=UNLOOK_AUDIT_LOG=/var/lib/unlook/audit/audit.log
Environment=UNLOOK_AUDIT_KEY_FILE=/etc/unlook/audit.key
Environment=UNLOOK_REPORT_DIR=/var/lib/unlook/reports
Environment=UNLOOK_CAD_DIR=/var/lib/unlook/cad
# Per-unit operator overrides (UNLOOK_* only), on the data partition.
EnvironmentFile=-/etc/unlook/stream.env
UMask=0077
# Conservative sandboxing. The daemon still runs as root (nmcli hotspot, BlueZ
# GATT registration, /dev/i2c-*, GPIO): see docs/SDK_CHANGES.md §5.
PrivateTmp=yes
ProtectHome=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
RestrictSUIDSGID=yes
LockPersonality=yes
NoNewPrivileges=yes
