# Persistent journal on the data partition (/var/log/journal is a bind mount of
# /data/journal), bounded so it can never fill the data partition.
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=256M
SystemKeepFree=1G
SystemMaxFileSize=32M
MaxRetentionSec=6month
RateLimitIntervalSec=30s
RateLimitBurst=10000
ForwardToSyslog=no
