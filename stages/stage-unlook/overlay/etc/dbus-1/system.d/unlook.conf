<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Unlook OS: the scanner daemon as the service user may talk to BlueZ (GATT
     server, advertising, pairing agent for BLE provisioning) and to
     NetworkManager (authorised per action by polkit, 49-unlook.rules). -->
<busconfig>
  <policy user="@SERVICE_USER@">
    <allow send_destination="org.bluez"/>
    <allow send_destination="org.freedesktop.NetworkManager"/>
  </policy>
</busconfig>
