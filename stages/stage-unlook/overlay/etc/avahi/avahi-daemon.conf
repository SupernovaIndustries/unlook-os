# Unlook OS: mDNS only to answer "<hostname>.local" (NET_MDNS=on, owner decision
# docs/OS.md §9). Addresses only: no services, no host info, no browsing
# domains, no wide-area, no reflector. IPv4 (the firewall opens UDP 5353).
[server]
use-ipv4=yes
use-ipv6=no
deny-interfaces=usb0
enable-dbus=no
disallow-other-stacks=yes
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=no

[publish]
disable-publishing=no
disable-user-service-publishing=yes
add-service-cookie=no
publish-addresses=yes
publish-hinfo=no
publish-workstation=no
publish-domain=no
publish-dns-servers=no
publish-resolv-conf-dns-servers=no
publish-aaaa-on-ipv4=no
publish-a-on-ipv6=no

[reflector]
enable-reflector=no

[rlimits]
rlimit-core=0
rlimit-data=8388608
rlimit-fsize=0
rlimit-nofile=768
rlimit-stack=8388608
rlimit-nproc=3
