#!/usr/sbin/nft -f
# Unlook OS firewall. Inbound: only the SDK protocols (TCP @FW_TCP_PORTS_NFT@),
# the DHCP/DNS that NetworkManager's shared mode serves to hotspot / USB-C
# clients, ICMP, SSH only while `unlook-ssh` has put 22 into @admin_tcp, the
# setup page only from the hotspot to the hotspot address, and mDNS when
# NET_MDNS=on. BLE is not IP and never passes here. The scanner never forwards.
# Own table only (no `flush ruleset`) so NetworkManager's table survives a reload.
table inet unlook
delete table inet unlook

table inet unlook {
    set admin_tcp {
        type inet_service
    }

    chain input {
        type filter hook input priority filter; policy drop;
        ct state invalid drop
        ct state established,related accept
        iif "lo" accept
        meta l4proto ipv6-icmp accept
        icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } limit rate 20/second accept
        tcp dport { @FW_TCP_PORTS_NFT@ } accept
        udp dport 67 accept
        udp sport 67 udp dport 68 accept
        udp sport 547 udp dport 546 accept
        udp dport 53 accept
        tcp dport 53 accept
        tcp dport @admin_tcp accept
        iifname "@NET_AP_IFACE@" ip daddr @NET_AP_IP@ tcp dport @NET_SETUP_PORT@ accept
        @NET_MDNS_NFT@
        limit rate 6/minute log prefix "unlook-fw drop: " level info
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
