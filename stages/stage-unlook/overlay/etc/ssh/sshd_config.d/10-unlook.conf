# Unlook OS: sshd only runs after `unlook-ssh enable`. Key-only, one account.
HostKey /etc/unlook/ssh/ssh_host_ed25519_key
AuthorizedKeysFile /etc/unlook/ssh/authorized_keys.d/%u
AllowUsers @ADMIN_USER@
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
MaxAuthTries 3
LoginGraceTime 20
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
ClientAliveInterval 60
