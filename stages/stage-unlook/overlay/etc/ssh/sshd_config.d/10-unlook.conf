# Unlook OS: sshd only runs while SSH is enabled (first boot with SSH_DEFAULT=on,
# `unlook-ssh enable`, the boot-partition seed, or Raspberry Pi Imager). Key-only
# unless a per-unit password exists; one account.
# Per-unit overrides on the data partition come FIRST (first value wins in sshd):
# /etc/unlook/ssh/sshd.d/10-password.conf (first-boot per-unit password or
# `unlook-ssh passwd`) and 10-imager-password.conf (password chosen in Raspberry
# Pi Imager) turn password login on (owner decisions, docs/OS.md §9).
Include /etc/unlook/ssh/sshd.d/*.conf
HostKey /etc/unlook/ssh/ssh_host_ed25519_key
AuthorizedKeysFile /etc/unlook/ssh/authorized_keys.d/%u .ssh/authorized_keys
# The login user (uid 1000, @ADMIN_USER@ unless renamed in Imager) is in this group.
AllowGroups unlook-ssh
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
MaxAuthTries 3
LoginGraceTime 20
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
ClientAliveInterval 60
