# RAUC: A/B rootfs, each with its own boot partition, Raspberry Pi firmware
# tryboot as the boot selector. Partition labels: image/mkimage.sh, docs/OS.md §3.
[system]
compatible=@RAUC_COMPATIBLE@
bootloader=custom
bundle-formats=-plain
data-directory=/data/rauc
max-bundle-download-size=4294967296

[keyring]
path=/etc/rauc/keyring.pem
check-purpose=codesign

[handlers]
bootloader-custom-backend=/usr/lib/unlook-os/rauc-tryboot-backend

[slot.rootfs.0]
device=/dev/disk/by-partlabel/unlook-root-a
type=ext4
bootname=A
resize=true

[slot.rootfs.1]
device=/dev/disk/by-partlabel/unlook-root-b
type=ext4
bootname=B
resize=true

[slot.bootfs.0]
device=/dev/disk/by-partlabel/unlook-boot-a
type=vfat
parent=rootfs.0

[slot.bootfs.1]
device=/dev/disk/by-partlabel/unlook-boot-b
type=vfat
parent=rootfs.1
