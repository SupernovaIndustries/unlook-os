# ===========================================================================
#  Unlook OS -- CI on the self-hosted GitLab (owner's NAS). No GitHub dependency.
#
#  Runner: the Raspberry Pi (arm64) shell runner, tags [rpi, arm64], with
#  docker (pi-gen runs privileged), qemu-system-aarch64, rauc, reprepro,
#  shellcheck via docker, and OpenCV >= 4.7 installed from opencv/build-deb.sh
#  (docs/OS.md §12 "CI runner").
#
#  Secrets (masked/protected "File" variables; production ones on tags only):
#    RAUC_SIGNING_CERT, RAUC_SIGNING_KEY   bundle signing (tags: production key)
#    RAUC_KEYRING                          CA certificate baked into the image
#    APT_SIGNING_KEY                       armored secret key of the apt repository
#    APT_KEYRING                           public keyring baked into the image
#    PUBLISH_SSH_KEY                       rsync to the NAS
#  Variables: APT_PUBLISH_TARGET, OTA_PUBLISH_TARGET (user@nas:/path), KEYRING_KIND
# ===========================================================================
stages: [lint, test, build, image, bundle, verify, publish]

default:
  tags: [rpi, arm64]

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  OPENCV_DEB_DIR: /var/cache/unlook-ci/opencv
  LIBCAMERA_DEB_DIR: /var/cache/unlook-ci/libcamera

.keys: &keys
  - mkdir -p keys/ci
  - install -m 0644 "$RAUC_KEYRING" keys/ci/rauc-keyring.pem
  - install -m 0644 "$APT_KEYRING" keys/ci/apt-archive-keyring.gpg
  - export KEYS_DIR=keys/ci KEYRING_KIND="${KEYRING_KIND:-ci}"

# ---- lint / unit tests (no hardware) -----------------------------------------
lint:shellcheck:
  stage: lint
  script:
    - >
      docker run --rm -v "$CI_PROJECT_DIR:/mnt" -w /mnt koalaman/shellcheck:stable -x -S style
      build.sh image/mkimage.sh rauc/*.sh scripts/*.sh opencv/*.sh libcamera/*.sh apt/*.sh tests/unit/run.sh tests/qemu/boot-test.sh
      stages/stage-unlook/prerun.sh stages/stage-unlook/*/0*-run.sh
      stages/stage-unlook/overlay/usr/sbin/unlook-*
      stages/stage-unlook/overlay/usr/lib/unlook-os/common.sh
      stages/stage-unlook/overlay/usr/lib/unlook-os/rauc-tryboot-backend
      stages/stage-unlook/overlay/usr/lib/unlook-os/unlook-*
      stages/stage-unlook/overlay/usr/lib/unlook-os/tryboot-guard
      stages/stage-unlook/overlay/usr/lib/unlook-os/ucp-ping

lint:units:
  stage: lint
  script:
    - systemd-analyze verify --man=no stages/stage-unlook/overlay/usr/lib/systemd/system/*.service || true
    - >
      sed -e 's/@FW_TCP_PORTS_NFT@/5555, 5556/' -e 's/@NET_AP_IFACE@/wlan0/' -e 's/@NET_AP_IP@/10.42.0.1/'
      -e 's/@NET_SETUP_PORT@/80/' -e 's/@NET_MDNS_NFT@/udp dport 5353 accept/'
      stages/stage-unlook/overlay/etc/nftables.conf | nft -c -f -

test:unit:
  stage: test
  script:
    - sh tests/unit/run.sh

# ---- packages -----------------------------------------------------------------
build:opencv:
  stage: build
  rules:
    - changes: [opencv/**/*]
    - when: manual
      allow_failure: true
  timeout: 4h
  script:
    - opencv/build-deb.sh
  artifacts:
    paths: [debs/]
    expire_in: 30 days

build:libcamera:
  stage: build
  rules:
    - changes: [libcamera/**/*, config/unlook-os.conf]
    - when: manual
      allow_failure: true
  timeout: 2h
  script:
    - libcamera/build-deb.sh
  artifacts:
    paths: [debs/unlook-libcamera_*.deb]
    expire_in: 90 days

build:sdk:
  stage: build
  script:
    # The runner has unlook-libcamera (same commit) installed: the SDK links its C++ API.
    - cp "$LIBCAMERA_DEB_DIR"/unlook-libcamera_*.deb debs/ 2>/dev/null || true
    - scripts/build-sdk-deb.sh
    # bookworm: the OpenCV >= 4.7 packages the SDK was built against ride along.
    - cp "$OPENCV_DEB_DIR"/*.deb debs/
  artifacts:
    paths: [debs/]
    expire_in: 30 days

# ---- image ----------------------------------------------------------------------
build:image:
  stage: image
  needs: [build:sdk, test:unit]
  timeout: 3h
  script:
    - *keys
    - ./build.sh rootfs
    - ./build.sh image
  artifacts:
    paths:
      - deploy/*.img.xz
      - deploy/*.rootfs.ext4
      - deploy/*.bootfs.vfat
      - deploy/*.SHA256SUMS
      - deploy/*.packages.tsv
      - deploy/build-info.env
      - deploy/unlook-os-rootfs.tar
    expire_in: 14 days

bundle:rauc:
  stage: bundle
  needs: [build:image]
  script:
    - *keys
    - ./build.sh bundle
  artifacts:
    paths: [deploy/*.raucb, deploy/latest]
    expire_in: 90 days

# ---- verification -----------------------------------------------------------------
test:qemu:
  stage: verify
  needs: [build:image]
  allow_failure: true       # becomes blocking once it has been green on the runner
  timeout: 1h
  script:
    - tests/qemu/boot-test.sh deploy
  artifacts:
    when: always
    paths: [deploy/qemu/serial.log]
    expire_in: 14 days

# ---- publication (tags = releases, production keys) -----------------------------------
.publish:
  stage: publish
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
  before_script:
    - eval "$(ssh-agent -s)" && ssh-add "$PUBLISH_SSH_KEY"

publish:apt:
  extends: .publish
  needs: [build:sdk, test:qemu]
  script:
    - apt/build-repo.sh "$HOME/unlook-apt" debs/*.deb

publish:os:
  extends: .publish
  needs: [bundle:rauc, test:qemu]
  script:
    - . deploy/build-info.env
    - . config/unlook-os.conf
    # Bundle first, pointer last: a unit never sees `latest` before the bundle exists.
    - rsync -a deploy/*.raucb "$OTA_PUBLISH_TARGET/$RAUC_COMPATIBLE/"
    - rsync -a deploy/latest "$OTA_PUBLISH_TARGET/$RAUC_COMPATIBLE/latest"
